name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: property-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [ gcc, clang ]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B out/build/linux-${{ matrix.compiler }} -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build out/build/linux-${{ matrix.compiler }} --parallel

      - name: Test
        run: ctest --test-dir out/build/linux-${{ matrix.compiler }} --output-on-failure

  windows:
    name: Windows (MSVC x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset x64-release

      - name: Build
        run: cmake --build out/build/x64-release --parallel

      - name: Test
        run: ctest --test-dir out/build/x64-release --output-on-failure

  macos:
    name: macOS (Universal arm64+x86_64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: cmake --preset macos-release

      - name: Build
        run: cmake --build out/build/macos-release --parallel

      - name: Verify Universal Binary
        run: lipo -info out/build/macos-release/test_property

      - name: Test
        run: ctest --test-dir out/build/macos-release --output-on-failure
